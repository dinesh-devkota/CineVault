name: Android TV

on:
  push:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test and build Android TV app
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Test, lint and build community app
        run: ./gradlew --no-daemon :core:test :app:testDebugUnitTest :app:lintDebug :app:assembleDebug :app:bundleRelease
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: cinevault-androidtv-debug
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
      - name: Upload unsigned community bundle
        uses: actions/upload-artifact@v4
        with:
          name: cinevault-androidtv-community-unsigned
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
      - name: Upload reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-reports
          path: |
            android/**/build/reports/
          if-no-files-found: ignore
